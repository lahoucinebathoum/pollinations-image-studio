
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pollinations Image Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:white;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
main{width:min(100%,600px);padding:24px;background:#1f2937;border-radius:16px;box-shadow:0 15px 40px #0005}
h1{font-size:clamp(24px,5vw,32px)}
p{line-height:1.5;color:#d1d5db}
input,button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:8px;font-size:15px}
input{background:#374151;color:white;border:1px solid #4b5563}
button{background:#8b5cf6;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.secondary{background:#374151}
#status{overflow-wrap:anywhere}
img{display:block;width:100%;margin-top:20px;border-radius:8px}
.small{font-size:13px;color:#9ca3af}
</style>
</head>
<body>
<main>
<h1>🎨 Pollinations Image Studio</h1>
<p>Décris ton image et génère-la avec tes propres Pollen.</p>

<div id="connection">
  <p id="account">Connecte ton compte Pollinations pour commencer.</p>
  <button id="connect">🔑 Connecter mon compte Pollinations</button>
  <button id="disconnect" class="secondary" hidden>Déconnecter</button>
</div>

<input id="prompt" placeholder="Ex. : un anime au coucher du soleil">
<button id="generate">Générer une image</button>
<p id="status" role="status" aria-live="polite"></p>
<img id="result" hidden alt="Image générée">
<p class="small">L'autorisation est personnelle. Tu peux la révoquer depuis ton compte Pollinations.</p>
</main>

<script>
const input = document.getElementById("prompt");
const button = document.getElementById("generate");
const status = document.getElementById("status");
const result = document.getElementById("result");
const connect = document.getElementById("connect");
const disconnect = document.getElementById("disconnect");
const account = document.getElementById("account");

let apiKey = null;
let imageUrl = null;

function updateConnection() {
  const connected = Boolean(apiKey);
  account.textContent = connected
    ? "✅ Compte Pollinations connecté dans cet onglet."
    : "Connecte ton compte Pollinations pour commencer.";
  connect.hidden = connected;
  disconnect.hidden = !connected;
}

function handleCallback() {
  const params = new URLSearchParams(location.hash.slice(1));
  const returnedKey = params.get("api_key");
  const returnedState = params.get("state");
  const expectedState = sessionStorage.getItem("pollinations_byop_state");

  if (returnedKey) {
    if (!expectedState || returnedState !== expectedState) {
      status.textContent =
        "Retour de connexion non vérifié. Recommence la connexion.";
      history.replaceState(null, "", location.pathname + location.search);
      return;
    }

    // Keep the temporary key in memory only.
    apiKey = returnedKey;
    sessionStorage.removeItem("pollinations_byop_state");

    // Remove the key from the visible URL immediately.
    history.replaceState(null, "", location.pathname + location.search);
    status.textContent = "Connexion réussie !";
  } else if (params.get("error")) {
    status.textContent = "Connexion refusée ou annulée.";
    history.replaceState(null, "", location.pathname + location.search);
    sessionStorage.removeItem("pollinations_byop_state");
  }

  updateConnection();
}

connect.onclick = () => {
  const state = crypto.randomUUID();
  sessionStorage.setItem("pollinations_byop_state", state);

  // Use this Space's own URL so a duplicated Space can return to itself.
  const redirectUri = location.origin + location.pathname;
  const params = new URLSearchParams({
    redirect_uri: redirectUri,
    state
  });

  location.href =
    "https://enter.pollinations.ai/authorize?" + params.toString();
};

disconnect.onclick = () => {
  apiKey = null;
  result.hidden = true;
  status.textContent = "Compte déconnecté.";
  updateConnection();
};

button.onclick = async () => {
  const prompt = input.value.trim();

  if (!prompt) {
    status.textContent = "Écris une description.";
    return;
  }

  if (!apiKey) {
    status.textContent = "Connecte d'abord ton compte Pollinations.";
    return;
  }

  button.disabled = true;
  result.hidden = true;
  status.textContent = "Génération en cours…";

  try {
    const url =
      "https://gen.pollinations.ai/image/" +
      encodeURIComponent(prompt) +
      "?width=1024&height=1024&nologo=true&seed=" +
      Math.floor(Math.random() * 1000000);

    const response = await fetch(url, {
      headers: { Authorization: "Bearer " + apiKey }
    });

    if (!response.ok) {
      throw new Error(
        response.status === 401 || response.status === 403
          ? "Autorisation expirée ou refusée. Reconnecte ton compte."
          : "Erreur API (" + response.status + "). Vérifie tes Pollen et réessaie."
      );
    }

    const blob = await response.blob();

    if (!blob.type.startsWith("image/")) {
      throw new Error("La réponse reçue n'est pas une image.");
    }

    if (imageUrl) URL.revokeObjectURL(imageUrl);
    imageUrl = URL.createObjectURL(blob);
    result.src = imageUrl;
    result.hidden = false;
    status.textContent = "Image générée !";
  } catch (error) {
    status.textContent = error.message || "Échec. Réessaie.";
  } finally {
    button.disabled = false;
  }
};

handleCallback();
updateConnection();
</script>
</body>
</html>
